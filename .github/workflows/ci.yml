name: DUALORA checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q dualora.py display_engine.py history.py tests
      - run: python -m unittest discover -s tests -v
  build-windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name DUALORA dualora.py
      - uses: actions/upload-artifact@v4
        with:
          name: DUALORA-Windows-v0.5.0
          path: dist/DUALORA.exe
          if-no-files-found: error
